<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="x-apple-disable-message-reformatting">
<!-- Évite que les clients mail en dark mode inversent les couleurs et
     cassent le design (fonds clairs + textes prévus pour fond clair). -->
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>SendBID</title>
<style>@media only screen and (max-width:560px){.mh-wrap{padding:10px 4px!important}.mh-px{padding-left:14px!important;padding-right:14px!important}.mh-h1{font-size:18px!important;line-height:1.3!important}.mh-digit{width:34px!important;height:44px!important;font-size:21px!important}.mh-gap{width:4px!important}.mh-btn{display:block!important;max-width:100%!important;box-sizing:border-box!important;text-align:center!important}.mh-foot{font-size:11px!important}img{max-width:100%!important;height:auto!important}table{max-width:100%!important}}@media only screen and (max-width:360px){.mh-digit{width:30px!important;height:40px!important;font-size:19px!important}.mh-gap{width:3px!important}.mh-h1{font-size:17px!important}}</style>

</head>
<body style="margin:0; padding:0; background:#eef0f6;
     font-family:'Segoe UI', Arial, sans-serif; -webkit-font-smoothing:antialiased;
     -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;
       font-size:1px; line-height:1px; color:#eef0f6;">Bienvenue</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
         border="0" class="mh-wrap" style="background:#eef0f6; padding:18px 8px;">
    <tr><td align="center">
      <!--[if mso]><table role="presentation" width="520" align="center"
            cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" width="520" cellpadding="0" cellspacing="0"
             border="0" align="center"
             style="width:100%; max-width:520px; margin:0 auto;">

        <!-- Header marque -->
        <tr><td class="mh-px" style="background:#5060a8;
              border-radius:16px 16px 0 0; padding:20px 20px;">
          <span style="color:#fff; font-size:20px; font-weight:800; letter-spacing:.3px; vertical-align:middle;">SendBID</span>
        </td></tr>

        <!-- Corps -->
        <tr><td class="mh-px" style="background:#ffffff; padding:30px 20px;
              border-left:1px solid #e5e7f0; border-right:1px solid #e5e7f0;
              overflow-wrap:break-word; word-break:break-word;">
          
      <h1 class="mh-h1" style="margin:0 0 16px; font-size:20px; font-weight:800; color:#111827;">Bienvenue</h1>
      <div style="color:#4b5563; font-size:15px; line-height:1.7;"><p>Message <b>test</b></p></div>
    
        </td></tr>

        <!-- Footer -->
        <tr><td class="mh-px" style="background:#f8f9fd; border:1px solid #e5e7f0; border-top:none;
              border-radius:0 0 16px 16px; padding:16px 20px; text-align:center;">
          <p class="mh-foot" style="margin:0; color:#9aa0b4; font-size:12px; line-height:1.6;">
            Message automatique de SendBID — merci de ne pas répondre.<br>
            Propulsé par MailHub<br><a href="https://x.io/unsub" style="color:#9aa0b4;">Se désinscrire de ces emails</a>
          </p>
        </td></tr>

      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
