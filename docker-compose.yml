services:
  redis:
    image: redis:7-alpine
    container_name: otp-redis
    restart: unless-stopped
    # Redis n'est PAS exposé sur l'hôte — accessible uniquement depuis le réseau interne
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - otp-network

  app:
    build: .
    container_name: otp-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      # `.env` est gitignoré : absent du repo cloné par Dokploy/CI. Sans
      # `required: false`, `docker compose up` échoue → l'ancienne version
      # reste en ligne. En prod, les variables passent par l'UI Dokploy.
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      HOST: 0.0.0.0
      PORT: 8000
      USE_FAKEREDIS: "false"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - otp-network
      # Réseau partagé avec le reverse proxy Dokploy/Traefik.
      # Décommenter UNIQUEMENT en déploiement Dokploy (le réseau externe doit
      # exister : `docker network create dokploy-network`). Laissé commenté,
      # `docker compose up` fonctionne en local sans dépendance externe.
      # - dokploy-network

volumes:
  redis_data:

networks:
  otp-network:
    driver: bridge
  # dokploy-network:
  #   external: true
