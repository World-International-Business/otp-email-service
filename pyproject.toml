[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otp-email-service"
version = "1.0.0"
description = "Microservice OTP par email pour SendBID / PayBID"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    # <8.2 : redis-py 8.2 recasse l'introspection fakeredis (__closure__ sur méthodes C)
    "redis>=5.2.0,<8.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "python-json-logger>=2.0.7",
    # >=2.40 : compatibilité redis-py 8.x (introspection __closure__ cassée avant)
    "fakeredis>=2.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
# Un test qui accroche (réseau réel, deadlock) échoue au bout de 3 min avec
# le dump des stacks de tous les threads — au lieu de bloquer la CI des
# heures sans diagnostic. "thread" car "signal" ne fonctionne pas sous
# Windows et n'interrompt pas un await asyncio.
timeout = 180
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# HTML templates / dictionnaires i18n : lignes longues attendues
"src/web/**" = ["E501"]
"examples/**" = ["E501", "E731"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
